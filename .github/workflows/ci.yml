name: CI/CD

on:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.VELOCITY_TOKEN }}

      - name: Check if release needed
        id: check
        run: |
          # Only release when commits since last tag contain a user-visible
          # prefix. Housekeeping (ci/chore/docs/refactor/style/test/build) lands
          # on main without triggering a tag or the installer cascade.
          LAST_TAG=$(git tag --sort=-v:refname | head -1)
          LAST_TAG=${LAST_TAG:-v0.0.0}
          COMMITS=$(git log ${LAST_TAG}..HEAD --pretty=format:"%s" 2>/dev/null || git log --pretty=format:"%s")

          if echo "$COMMITS" | grep -qiE "^feat|^fix|^perf|^add|BREAKING|!:"; then
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "Releasable commits found since $LAST_TAG — proceeding."
          else
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "No feat/fix/perf/BREAKING commits since $LAST_TAG — skipping release."
          fi

      - name: Calculate version
        if: steps.check.outputs.skip == 'false'
        id: version
        run: |
          LAST_TAG=$(git tag --sort=-v:refname | head -1)
          LAST_TAG=${LAST_TAG:-v0.0.0}
          echo "last_tag=$LAST_TAG" >> $GITHUB_OUTPUT

          COMMITS=$(git log ${LAST_TAG}..HEAD --pretty=format:"%s" 2>/dev/null || git log --pretty=format:"%s")

          VERSION=${LAST_TAG#v}
          MAJOR=$(echo $VERSION | cut -d. -f1)
          MINOR=$(echo $VERSION | cut -d. -f2)
          PATCH=$(echo $VERSION | cut -d. -f3)

          HAS_BREAKING=false
          HAS_FEAT=false

          while IFS= read -r msg; do
            [ -z "$msg" ] && continue
            if echo "$msg" | grep -qiE "BREAKING|!:"; then
              HAS_BREAKING=true
            fi
            if echo "$msg" | grep -qiE "^feat|^add"; then
              HAS_FEAT=true
            fi
          done <<< "$COMMITS"

          if [ "$HAS_BREAKING" = true ]; then
            MAJOR=$((MAJOR + 1))
            MINOR=0
            PATCH=0
          elif [ "$HAS_FEAT" = true ]; then
            MINOR=$((MINOR + 1))
            PATCH=0
          else
            PATCH=$((PATCH + 1))
          fi

          NEW="$MAJOR.$MINOR.$PATCH"
          echo "new=$NEW" >> $GITHUB_OUTPUT
          echo "Bumping version: $LAST_TAG -> v$NEW"

      - name: Set up Go
        if: steps.check.outputs.skip == 'false'
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Auto-format
        if: steps.check.outputs.skip == 'false'
        run: |
          gofmt -w .
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore: auto-format with gofmt"
          fi

      - name: Run tests
        if: steps.check.outputs.skip == 'false'
        run: go test ./... -short

      - name: Commit and tag
        if: steps.check.outputs.skip == 'false'
        run: |
          NEW_VERSION=${{ steps.version.outputs.new }}

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git tag "v$NEW_VERSION"
          git push origin "v$NEW_VERSION"

      - name: Create GitHub Release
        if: steps.check.outputs.skip == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.new }}
          generate_release_notes: true

      - name: Notify Go Module Proxy
        if: steps.check.outputs.skip == 'false'
        run: |
          VERSION=v${{ steps.version.outputs.new }}
          curl -sf "https://proxy.golang.org/github.com/velocitykode/velocity-cli/@v/${VERSION}.info" || true
          echo "Go module proxy notified for ${VERSION}"

      - name: Cascade to velocity-installer
        if: steps.check.outputs.skip == 'false'
        env:
          VELOCITY_TOKEN: ${{ secrets.VELOCITY_TOKEN }}
        run: |
          NEW_VERSION=${{ steps.version.outputs.new }}
          git clone "https://x-access-token:${VELOCITY_TOKEN}@github.com/velocitykode/velocity-installer.git" /tmp/installer
          cd /tmp/installer

          go get "github.com/velocitykode/velocity-cli@v${NEW_VERSION}"
          go mod tidy

          if git diff --quiet go.mod go.sum; then
            echo "No go.mod changes — installer already on v${NEW_VERSION}."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add go.mod go.sum
          git commit -m "fix(deps): bump velocity-cli to v${NEW_VERSION}"
          git push origin main
